<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131015" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Seguimiento de clientas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Majho">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vuelve Majho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════
   COLORES DEL NEGOCIO — solo se cambian los cinco primeros.
   Todo lo demás se calcula a partir de ellos.
   El bloque gemelo para modo oscuro está más abajo.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ground:#FDF3F7;        /* papel: el fondo de toda la app */
  --ink:#1A1518;           /* tinta: textos y el monograma */
  --accent:#D93B78;        /* acento: botones y lo urgente */
  --accent-soft:#FCE4EE;   /* acento suave: fondos de etiquetas */

  --on-accent:#FFFFFF;     /* texto encima del acento */

  /* De aquí abajo todo se calcula solo a partir de los de arriba.
     El primer valor de cada línea es el respaldo para navegadores viejos
     que no entienden color-mix: son grises neutros que quedan bien con
     cualquier paleta. */
  --surface:#FFFFFF;   --surface:color-mix(in srgb, #fff 72%, var(--ground));
  --surface-2:#F0EEEC; --surface-2:color-mix(in srgb, var(--ink) 6%, var(--ground));
  --line:#E2DEDA;      --line:color-mix(in srgb, var(--ink) 13%, var(--ground));
  --line-soft:#EDEAE7; --line-soft:color-mix(in srgb, var(--ink) 7%, var(--ground));
  --ink-2:#4F4A46;     --ink-2:color-mix(in srgb, var(--ink) 76%, var(--ground));
  --muted:#87817C;     --muted:color-mix(in srgb, var(--ink) 52%, var(--ground));
  --accent-ink:#B02660;--accent-ink:color-mix(in srgb, var(--accent) 82%, var(--ink));
  --ok:#227A5C;--warn:#9E6A12;
  --ok-soft:#E3F2EC;   --ok-soft:color-mix(in srgb, var(--ok) 12%, var(--ground));
  --warn-soft:#FAF0DC; --warn-soft:color-mix(in srgb, var(--warn) 14%, var(--ground));
  --lost:#8E8189;      --lost:color-mix(in srgb, var(--ink) 48%, var(--ground));
  --lost-soft:#F1EAEE; --lost-soft:color-mix(in srgb, var(--ink) 7%, var(--ground));
  --shadow:0 1px 2px rgba(26,21,24,.05),0 10px 28px -14px rgba(26,21,24,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131015;
  --ink:#F8F0F4;
  --accent:#FF7BAC;
  --accent-soft:#3B1F2C;
  --on-accent:#1A1015;

  --surface:#1D181C;   --surface:color-mix(in srgb, var(--ink) 7%, var(--ground));
  --surface-2:#292127; --surface-2:color-mix(in srgb, var(--ink) 12%, var(--ground));
  --line:#372C33;      --line:color-mix(in srgb, var(--ink) 18%, var(--ground));
  --line-soft:#2C242A; --line-soft:color-mix(in srgb, var(--ink) 11%, var(--ground));
  --ink-2:#CDBFC7;     --ink-2:color-mix(in srgb, var(--ink) 78%, var(--ground));
  --muted:#A0919A;     --muted:color-mix(in srgb, var(--ink) 58%, var(--ground));
  --accent-ink:#FFA4C6;--accent-ink:color-mix(in srgb, var(--accent) 72%, var(--ink));
  --ok:#5CC79C;--warn:#DDA855;
  --ok-soft:#12332A;   --ok-soft:color-mix(in srgb, var(--ok) 16%, var(--ground));
  --warn-soft:#32270F; --warn-soft:color-mix(in srgb, var(--warn) 16%, var(--ground));
  --lost:#8B7F87;      --lost:color-mix(in srgb, var(--ink) 52%, var(--ground));
  --lost-soft:#272029; --lost-soft:color-mix(in srgb, var(--ink) 10%, var(--ground));
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#131015;
  --ink:#F8F0F4;
  --accent:#FF7BAC;
  --accent-soft:#3B1F2C;
  --on-accent:#1A1015;

  --surface:#1D181C;   --surface:color-mix(in srgb, var(--ink) 7%, var(--ground));
  --surface-2:#292127; --surface-2:color-mix(in srgb, var(--ink) 12%, var(--ground));
  --line:#372C33;      --line:color-mix(in srgb, var(--ink) 18%, var(--ground));
  --line-soft:#2C242A; --line-soft:color-mix(in srgb, var(--ink) 11%, var(--ground));
  --ink-2:#CDBFC7;     --ink-2:color-mix(in srgb, var(--ink) 78%, var(--ground));
  --muted:#A0919A;     --muted:color-mix(in srgb, var(--ink) 58%, var(--ground));
  --accent-ink:#FFA4C6;--accent-ink:color-mix(in srgb, var(--accent) 72%, var(--ink));
  --ok:#5CC79C;--warn:#DDA855;
  --ok-soft:#12332A;   --ok-soft:color-mix(in srgb, var(--ok) 16%, var(--ground));
  --warn-soft:#32270F; --warn-soft:color-mix(in srgb, var(--warn) 16%, var(--ground));
  --lost:#8B7F87;      --lost:color-mix(in srgb, var(--ink) 52%, var(--ground));
  --lost-soft:#272029; --lost-soft:color-mix(in srgb, var(--ink) 10%, var(--ground));
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Figtree","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:78px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

.shell{max-width:640px;margin:0 auto;padding:0 16px}

/* ---- topbar ---- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--ink);
  display:grid;place-items:center;flex:none}
.logo span{font-family:"Bodoni Moda",Georgia,serif;font-weight:700;font-size:18px;color:var(--ink);line-height:1;
  letter-spacing:-.13em;padding-left:.11em}
.brand{line-height:1.15;min-width:0}
.brand b{display:block;font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:17.5px;
  letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.gear{margin-left:auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.gear:hover{background:var(--surface-2);color:var(--ink)}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- headline strip ---- */
.strip{padding:18px 0 4px}
.strip h1{font-size:24px}
.strip .note{color:var(--muted);font-size:13.5px;margin-top:3px}

/* ---- views ---- */
.view{display:none;padding:14px 0 8px}
.view.on{display:block}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  display:flex;flex-direction:column;gap:10px}
.card.urge{border-left:3px solid var(--accent);padding-left:12px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who{min-width:0}
.who b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
.who i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:1px}
.money{font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:999px;font-weight:500}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.vencida{background:var(--accent-soft);color:var(--accent-ink)}
.chip.porvencer{background:var(--warn-soft);color:var(--warn)}
.chip.aldia{background:var(--ok-soft);color:var(--ok)}
.chip.perdida{background:var(--lost-soft);color:var(--lost)}
.chip.escrita{background:var(--ok-soft);color:var(--ok)}
.chip.plain{background:var(--surface-2);color:var(--muted)}
.chip.premio{background:var(--ink);color:var(--ground)}
.pts{border-top:1px solid var(--line-soft);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.pts .l{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.pts .l b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.pts.listo .progreso span{background:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:11px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;transition:filter .15s ease;
  text-decoration:none;width:100%}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:15px;height:15px;flex:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);font-weight:600}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px;width:auto}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--accent);font-weight:600}
.pair{display:flex;gap:8px}
.pair .btn{flex:1}

.done{opacity:.5}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:34px 18px;border:1px dashed var(--line);
  border-radius:14px;background:var(--surface);line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---- toolbar ---- */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px}
.search svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.search input{border:none;background:none;outline:none;width:100%;font-size:15px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---- servicio rows ---- */
.svcs{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line-soft);padding-top:11px}
.svc{background:var(--surface-2);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.svc .l1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.svc .nm{font-weight:600;font-size:14px}
.svc .l2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.svc .acts{display:flex;gap:7px;flex-wrap:wrap}

/* ---- stats ---- */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px}
.stat .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:32px;font-weight:800;line-height:1.1;margin-top:5px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stat .n{font-size:13px;color:var(--muted);margin-top:3px}
.stat.hi .v{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .stat .v{font-size:24px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.bar{display:grid;grid-template-columns:minmax(64px,92px) 1fr auto;gap:9px;align-items:center;font-size:12.5px}
.bar .t{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .f{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .a{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- tabbar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(9px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{font-size:10.5px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar .bg{position:absolute;top:-5px;left:11px;background:var(--accent);color:var(--on-accent);
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;min-width:16px;height:16px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---- portada de apertura ---- */
.splash{
  position:fixed;inset:0;z-index:100;background:var(--ground);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
.splash.ir{opacity:0;pointer-events:none}
.sp-tex{position:absolute;inset:0;width:100%;height:100%;color:var(--ink);opacity:.055;pointer-events:none}
.sp-block,.sp-dir{position:relative;z-index:1}
.sp-block{display:flex;flex-direction:column;align-items:center;transform:translateY(-7%);
  padding:0 26px;max-width:100%}
.sp-mark{
  width:clamp(92px,26vw,152px);aspect-ratio:1;border-radius:50%;
  border:2px solid var(--ink);display:grid;place-items:center;
}
.sp-mark span{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:700;line-height:1;color:var(--ink);
  font-size:clamp(40px,11.4vw,66px);letter-spacing:-.13em;padding-left:.11em;
}
.sp-rule{width:62px;height:2px;background:var(--accent);margin:clamp(22px,5.4vw,34px) 0}
.sp-name{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;color:var(--ink);
  font-size:clamp(24px,7vw,44px);letter-spacing:.05em;text-transform:uppercase;
  line-height:1.12;text-align:center;text-wrap:balance;overflow-wrap:break-word;max-width:100%;
}
.sp-sub{
  font-family:"Figtree",Arial,sans-serif;font-weight:500;color:var(--muted);
  font-size:clamp(11px,2.9vw,14px);letter-spacing:.26em;text-transform:uppercase;margin-top:14px;
}
.sp-dir{
  position:absolute;bottom:9%;left:0;right:0;text-align:center;padding:0 24px;
  font-family:"Bodoni Moda",Georgia,serif;color:var(--muted);font-size:13.5px;letter-spacing:.02em;
}

/* ---- campañas ---- */
.aviso{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  font-size:13px;line-height:1.5;color:var(--ink-2)}
.aviso b{color:var(--ink)}
.grupo{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.grupo>.eyebrow{margin-bottom:-2px}
.tpls{display:flex;gap:6px;flex-wrap:wrap}
.tpls button{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.tpls button:hover{border-color:var(--accent);color:var(--accent)}
.prev{background:var(--ok-soft);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;
  font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.cuenta-seg{display:flex;align-items:baseline;gap:9px}
.cuenta-seg b{font-size:30px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.progreso{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:9px}
.progreso span{display:block;height:100%;background:var(--accent);border-radius:4px}

/* ---- fab ---- */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:29;
  background:var(--ink);color:var(--ground);border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;
  box-shadow:var(--shadow);display:none;align-items:center;gap:7px}
.fab.on{display:inline-flex}
@media (min-width:672px){.fab{right:calc(50vw - 320px + 16px)}}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(26,15,20,.5);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:13px}
@media (min-width:672px){.scrim{align-items:center}.modal{border-radius:20px;max-height:86vh}}
.modal h3{font-size:19px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:15px;width:100%;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:104px;resize:vertical;line-height:1.5;font-size:14.5px}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--accent);font-size:13px;font-weight:600;display:none}
.err.on{display:block}
.msgbox{background:var(--ok-soft);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;
  font-size:14px;line-height:1.55;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:60;background:var(--ink);color:var(--ground);
  padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.foot{color:var(--muted);font-size:12px;text-align:center;padding:22px 0 8px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="splash" id="splash" aria-hidden="true">
  <svg class="sp-tex" aria-hidden="true" focusable="false"><defs><path id="g" d="M14 0C14 9 28 15 28 24A14 14 0 0 1 0 24C0 15 14 9 14 0Z" fill="currentColor"/><pattern id="gotas" width="420" height="420" patternUnits="userSpaceOnUse"><use href="#g" transform="translate(40 58) rotate(-15) scale(0.60)"/><use href="#g" transform="translate(252 28) rotate(12) scale(0.52)"/><use href="#g" transform="translate(138 208) rotate(24) scale(0.66)"/><use href="#g" transform="translate(348 246) rotate(-8) scale(0.56)"/><use href="#g" transform="translate(58 338) rotate(6) scale(0.60)"/><use href="#g" transform="translate(300 372) rotate(-20) scale(0.50)"/><use href="#g" transform="translate(196 120) rotate(15) scale(0.44)"/></pattern></defs><rect width="100%" height="100%" fill="url(#gotas)"/></svg>
  <div class="sp-block">
    <div class="sp-mark"><span id="sp-mono">MS</span></div>
    <div class="sp-rule"></div>
    <div class="sp-name" id="sp-nombre">Majho Salón</div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN DEL SALÓN
   Esto es lo ÚNICO que se cambia para montar la app de otro salón.
   Debajo de este bloque no hay nada específico de Majho.
   Los colores están arriba, en el CSS, marcados igual.
   ══════════════════════════════════════════════════════════════════════ */
var SALON = {
  nombre:    "Majho Salón",
  bajada:    "Nails · Lash & Hair",
  monograma: "MS",
  direccion: "Los Tiamos 126 · Camacho, La Molina",
  horario:   "de lunes a sábado de 10am a 8pm",

  /* "f" = clientas (salón, spa, estética) · "m" = clientes (barbería, veterinaria…)
     Cambia solo esta letra y toda la app se reescribe sola. */
  genero: "f",

  /* Cada servicio: [nombre, cada cuántos días vuelve, precio]. Ciclo 0 = sin ciclo fijo. */
  servicios: [

  ["Uñas", [
    ["Uñas acrílicas",21,110],["Polygel",21,110],["Softgel",21,90],["Uñas rubber",21,90],
    ["Semipermanente",15,70],["Baño de acrílico",21,80],["Manicure",15,35],["Pedicure",30,45]
  ]],
  ["Cabello", [
    ["Corte",60,45],["Color y retoque de raíz",45,150],["Mechas / balayage",90,250],
    ["Tratamiento capilar",30,90],["Planchado / keratina",120,220],["Cepillado",15,40]
  ]],
  ["Cejas y pestañas", [
    ["Depilación de cejas",21,20],["Diseño de cejas",21,30],["Laminado de cejas",45,90],
    ["Lifting de pestañas",45,90],["Extensiones de pestañas",21,130]
  ]],
  ["Rostro y más", [
    ["Limpieza facial",30,90],["Depilación",30,50],["Maquillaje",0,120]
  ]]
],

  /* Cómo se le nombra a cada servicio dentro del recordatorio.
     Si un servicio no está aquí, el mensaje dice "ya te toca tu cita". */
  frases: {
    "Uñas acrílicas":"ya te toca retoque de uñas","Polygel":"ya te toca retoque de uñas",
    "Softgel":"ya te toca retoque de uñas","Uñas rubber":"ya te toca retoque de uñas",
    "Semipermanente":"tu esmaltado ya debe estar creciendo","Baño de acrílico":"ya te toca retoque",
    "Manicure":"ya toca tu manicure","Pedicure":"ya toca tu pedicure",
    "Corte":"ya toca refrescar tu corte","Color y retoque de raíz":"ya se te debe estar viendo la raíz",
    "Mechas / balayage":"ya toca retocar tus mechas","Tratamiento capilar":"ya toca renovar tu tratamiento",
    "Planchado / keratina":"ya toca renovar tu planchado","Cepillado":"¿te hago tu cepillado esta semana?",
    "Depilación de cejas":"ya toca retocar tus cejas","Diseño de cejas":"ya toca retocar tus cejas",
    "Laminado de cejas":"tu laminado ya está por bajar","Lifting de pestañas":"tu lifting ya está por caer",
    "Extensiones de pestañas":"tus pestañas ya piden retoque",
    "Limpieza facial":"ya toca tu limpieza facial","Depilación":"ya toca tu depilación","Maquillaje":"te escribo por si tienes algún evento"
  },

  /* Mensajes de promo. {nombre} se reemplaza con el nombre de cada clienta. */
  plantillas: [
    ["Promo del mes",
     "Hola {nombre} ✨ Te saluda Majho Salón.\n\nEste mes tenemos uñas acrílicas, polygel o softgel a S/110, y color entero o francesa a S/90.\n\nEstamos de lunes a sábado de 10am a 8pm. ¿Te reservo tu hora?"],
    ["Me quedaron horas libres",
     "Hola {nombre} ✨ Te saluda Majho Salón.\n\nMe quedaron horas libres esta semana y me acordé de ti. Si quieres aprovechar, dime qué día te queda mejor y te la guardo.\n\nLunes a sábado de 10am a 8pm."],
    ["Vuelve con descuento",
     "Hola {nombre} ✨ Te saluda Majho Salón.\n\nHace rato que no te vemos por acá y te queremos de vuelta: tienes 20% de descuento en tu próximo servicio.\n\n¿Qué día te acomoda?"],
    ["Fecha especial",
     "Hola {nombre} ✨ Te saluda Majho Salón.\n\nSe viene una fecha especial y las horas se llenan rápido. Si quieres separar la tuya, avísame y te la guardo.\n\nEstamos en Los Tiamos 126, Camacho — La Molina."]
  ]
};
/* ═══════════════ fin de la configuración ═══════════════ */

/* Escribe el nombre del salón en la pantalla. */
(function(){
  function poner(id, txt){ var e = document.getElementById(id); if(e) e.textContent = txt; }
  poner("s-mono", SALON.monograma);   poner("sp-mono", SALON.monograma);
  poner("s-nombre", SALON.nombre);    poner("sp-nombre", SALON.nombre);
  poner("s-bajada", SALON.bajada);    poner("sp-bajada", SALON.bajada);
  poner("sp-dir", SALON.direccion);
  poner("foot", "Vuelve · hecho para " + SALON.nombre);
  document.title = "Vuelve " + SALON.nombre.split(" ")[0];
})();

/* Toda la app está escrita en femenino ("clienta", "vencida", "Nueva clienta").
   Si el negocio es de rubro masculino, este traductor reescribe los textos al vuelo.
   Ojo: NO se toca "sola" ni "la app" — eso se refiere a la aplicación, no al cliente. */
var GEN = (function(){
  if(SALON.genero !== "m") return function(t){ return t; };
  var R = [
    /* frases primero, para que el artículo salga bien */
    ["una clienta","un cliente"], ["Una clienta","Un cliente"],
    ["la clienta","el cliente"],  ["La clienta","El cliente"],
    ["las clientas","los clientes"], ["Las clientas","Los clientes"],
    ["esta clienta","este cliente"], ["Esta clienta","Este cliente"],
    ["ninguna clienta","ningún cliente"], ["Ninguna clienta","Ningún cliente"],
    ["Nueva clienta","Nuevo cliente"], ["nueva clienta","nuevo cliente"],
    ["Solo las perdidas","Solo los perdidos"],
    ["Solo las que sí vienen","Solo los que sí vienen"],
    ["primera clienta","primer cliente"],
    ["cuántas clientas","cuántos clientes"],
    ["todas las clientas","todos los clientes"],
    ["Todas las clientas","Todos los clientes"],
    ["clientas registradas","clientes registrados"],
    ["clienta registrada","cliente registrado"],
    ["clientas atrasadas","clientes atrasados"],
    ["clienta está atrasada","cliente está atrasado"],
    ["clientas volvieron","clientes volvieron"], ["clienta volvió","cliente volvió"],
    ["clienta borrada","cliente borrado"], ["Clienta borrada","Cliente borrado"],
    ["clienta agregada","cliente agregado"],
    /* palabras sueltas */
    ["clientas","clientes"], ["Clientas","Clientes"],
    ["clienta","cliente"],   ["Clienta","Cliente"],
    ["Vencidas","Vencidos"], ["vencidas","vencidos"],
    ["Vencida","Vencido"],   ["vencida","vencido"],
    ["Perdidas","Perdidos"], ["perdidas","perdidos"],
    ["Perdida","Perdido"],   ["perdida","perdido"],
    ["atrasadas","atrasados"], ["atrasada","atrasado"],
    ["Escritas","Escritos"], ["escritas","escritos"],
    ["Escrita","Escrito"],   ["escrita","escrito"],
    ["saltadas","saltados"], ["saltada","saltado"],
    ["revisadas","revisados"],
    ["registradas","registrados"],   /* ojo: solo plural — "Visita registrada" NO se toca */
    ["cargadas","cargados"], ["borradas","borrados"], ["listas","listos"],
    ["Todas","Todos"],
    ["Marcada","Marcado"], ["agregada","agregado"]
  ];
  var re = R.map(function(p){ return [new RegExp(p[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "g"), p[1]]; });
  return function(t){
    if(typeof t !== "string") return t;
    for(var i=0;i<re.length;i++) t = t.replace(re[i][0], re[i][1]);
    return t;
  };
})();

/* la etiqueta de la pestaña vive en el HTML, no pasa por el() */
(function(){
  var b = document.querySelector('.tabbar button[data-tab="clientas"]');
  if(b && b.lastChild && b.lastChild.nodeType === 3) b.lastChild.nodeValue = "\n      " + GEN("Clientas") + "\n    ";
  var f = document.getElementById("fab");
  if(f && f.lastChild && f.lastChild.nodeType === 3) f.lastChild.nodeValue = "\n  " + GEN("Nueva clienta") + "\n";
})();

var CAT = SALON.servicios;
var META = {};   // servicio -> {g:grupo, c:ciclo, t:precio}
CAT.forEach(function(gr){ gr[1].forEach(function(it){ META[it[0]] = {g:gr[0], c:it[1], t:it[2]}; }); });

var FRASE = SALON.frases || {};

/* ============ fechas ============ */
function pad(n){ return (n<10?"0":"") + n; }
function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
var HOY = iso(new Date());
function ms(s){ var p = String(s).split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function dias(a,b){ return Math.round((ms(b) - ms(a)) / 86400000); }   // de a hasta b
function masDias(s,n){ var d = new Date(ms(s) + n*86400000); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
function bonito(s){
  var M = ["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
  var p = String(s).split("-"); return (+p[2]) + " " + M[+p[1]-1] + " " + p[0];
}
function soles(n){ return "S/ " + Math.round(n).toLocaleString("es-PE"); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(h){ var d = document.createElement("div"); d.innerHTML = GEN(h).trim(); return d.firstChild; }

/* ============ estado ============ */
var KEY = "majho_vuelve_v1";
var S = {v:1, clientas:[], rescates:[], camp:null, campHist:[], puntos:{activo:false, meta:500, premio:"S/ 50 de descuento"}, canjes:[]};
var seq = 1;

function cargar(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var p = JSON.parse(raw); if(p && p.clientas){ S = p; S.rescates = S.rescates || []; S.campHist = S.campHist || []; S.camp = S.camp || null;
        S.canjes = S.canjes || []; S.puntos = S.puntos || {activo:false, meta:500, premio:"S/ 50 de descuento"};
        S.clientas.forEach(function(c){ c.pts = c.pts || 0; c.ptsTotal = c.ptsTotal || 0; }); } }
  }catch(e){}
  S.clientas.forEach(function(c){ var n = parseInt(c.id,10); if(n >= seq) seq = n+1; });
}
var PUEDE_GUARDAR = (function(){
  try{ localStorage.setItem("__mj","1"); localStorage.removeItem("__mj"); return true; }
  catch(e){ return false; }
})();
function guardar(){
  if(!PUEDE_GUARDAR) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ PUEDE_GUARDAR = false; avisoStorage(); }
}
function avisoStorage(){
  if(document.getElementById("nostore")) return;
  var b = el('<div id="nostore" style="background:var(--accent-soft);color:var(--accent-ink);' +
    'border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px;line-height:1.45;text-align:center">' +
    '<b>Este navegador no está guardando tus clientas.</b> Suele pasar en modo incógnito o con los datos de sitios bloqueados. ' +
    'Abre el enlace en Chrome o Safari normal y vuelve a intentarlo.</div>');
  document.querySelector(".top").insertAdjacentElement("afterend", b);
}
function nuevoId(){ return String(seq++); }

/* ============ reglas ============ */
function estado(sv){
  if(!sv.c) return "aldia";                 // servicio sin ciclo (maquillaje)
  var a = dias(sv.u, HOY) - sv.c;           // días de atraso
  if(a > 45) return "perdida";
  if(a > 0)  return "vencida";
  if(a >= -4) return "porvencer";
  return "aldia";
}
function atraso(sv){ return dias(sv.u, HOY) - sv.c; }
function estadoClienta(c){
  var vistos = c.svcs.map(estado);
  if(vistos.indexOf("vencida") >= 0) return "vencida";
  if(vistos.indexOf("porvencer") >= 0) return "porvencer";
  if(vistos.length && vistos.every(function(e){ return e === "perdida"; })) return "perdida";
  return "aldia";
}
function premioListo(c){ return S.puntos.activo && (c.pts || 0) >= S.puntos.meta; }
function faltan(c){ return Math.max(0, S.puntos.meta - (c.pts || 0)); }

function escritaReciente(sv){ return sv.w && dias(sv.w, HOY) <= 7; }
function prioridad(sv){ return sv.t * (1 - Math.min(atraso(sv), 60) / 60); }

function pendientes(){
  // una fila por CLIENTA, con todos sus servicios vencidos juntos:
  // nadie le escribe dos veces el mismo día a la misma persona.
  var out = [];
  S.clientas.forEach(function(c){
    var svs = c.svcs.filter(function(sv){ return estado(sv) === "vencida" && !escritaReciente(sv); });
    if(!svs.length) return;
    svs.sort(function(a,b){ return prioridad(b) - prioridad(a); });
    out.push({
      c: c,
      svs: svs,
      total: svs.reduce(function(a,sv){ return a + sv.t; }, 0),
      // una clienta con premio acumulado es la más fácil de traer de vuelta: va primero
      prio: Math.max.apply(null, svs.map(prioridad)) + (premioListo(c) ? 10000 : 0)
    });
  });
  out.sort(function(a,b){ return b.prio - a.prio; });
  return out;
}
function escritasHoy(){
  var out = [];
  S.clientas.forEach(function(c){
    var svs = c.svcs.filter(function(sv){ return sv.w === HOY; });
    if(svs.length) out.push({c:c, svs:svs, total:svs.reduce(function(a,sv){ return a + sv.t; }, 0)});
  });
  return out;
}

function mensaje(c, svs){
  if(!Array.isArray(svs)) svs = [svs];
  var nom = String(c.n).trim().split(/\s+/)[0];
  var cierre = (premioListo(c) ? "\n\nY ojo: ya juntaste tus puntos 🎁 te espera " + S.puntos.premio + "." : "") +
    "\n\nTengo espacio esta semana, " + SALON.horario + ". ¿Qué día te queda mejor?";
  var saludo = "Hola " + nom + " ✨ Te saluda " + SALON.nombre + ".\n\n";
  if(svs.length === 1){
    var sv = svs[0];
    return saludo + "Tu última visita fue hace " + dias(sv.u, HOY) + " días (" +
      sv.s.toLowerCase() + ") y " + (FRASE[sv.s] || "ya te toca tu cita") + "." + cierre;
  }
  var lista = svs.map(function(sv){
    return "• " + sv.s + " — última hace " + dias(sv.u, HOY) + " días";
  }).join("\n");
  return saludo + "Revisando mi agenda vi que ya te toca:\n" + lista + cierre;
}
function telBonito(t){
  var d = String(t || "").replace(/\D/g, "");
  if(d.length === 11 && d.slice(0,2) === "51") d = d.slice(2);
  return d.length === 9 ? d.slice(0,3) + " " + d.slice(3,6) + " " + d.slice(6) : d;
}
function waHref(c, txt){
  var t = String(c.tel || "").replace(/\D/g, "");
  if(t.length === 9) t = "51" + t;
  return t ? "https://wa.me/" + t + "?text=" + encodeURIComponent(txt)
           : "https://wa.me/?text=" + encodeURIComponent(txt);
}

/* ============ chrome ============ */
var toast = document.getElementById("toast"), tt = null;
function aviso(txt){
  toast.textContent = GEN(txt); toast.classList.add("on");
  clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove("on"); }, 2200);
}
var scrim = document.getElementById("scrim"), modal = document.getElementById("modal");
function abrir(html){ modal.innerHTML = GEN(html); scrim.classList.add("on"); modal.scrollTop = 0; }
function cerrar(){ scrim.classList.remove("on"); modal.innerHTML = ""; }
scrim.addEventListener("click", function(e){ if(e.target === scrim) cerrar(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") cerrar(); });

function chip(e){
  var t = {vencida:"Vencida", porvencer:"Por vencer", aldia:"Al día", perdida:"Perdida", escrita:"Escrita hoy"};
  return '<span class="chip ' + e + '">' + t[e] + '</span>';
}

/* ============ vista HOY ============ */
var vHoy = document.getElementById("v-hoy");
function pintarHoy(){
  var pend = pendientes(), hechas = escritasHoy();
  vHoy.innerHTML = "";

  if(!S.clientas.length){
    vHoy.appendChild(el(
      '<div class="empty"><b>Todavía no hay clientas</b>' +
      'Agrega a las clientas que ya atiendes con la fecha de su última visita.<br>' +
      'Desde ahí la app te avisa sola a quién le toca volver.' +
      '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn" type="button" data-go="nueva">Agregar mi primera clienta</button>' +
      '<button class="btn line" type="button" data-go="ejemplo">Ver cómo se ve con ejemplos</button>' +
      '</div></div>'
    ));
    vHoy.querySelector('[data-go="nueva"]').addEventListener("click", formClienta);
    vHoy.querySelector('[data-go="ejemplo"]').addEventListener("click", cargarEjemplos);
    return;
  }

  var wrap = el('<div class="stack"></div>');
  if(!pend.length){
    wrap.appendChild(el(
      '<div class="empty"><b>Nada pendiente hoy</b>' +
      'Ninguna clienta está atrasada. La lista se arma sola cuando a alguien le toque volver.</div>'
    ));
  }
  // Nadie escribe 300 mensajes en un día: una lista así de larga se abandona.
  // Mostramos las más urgentes y decimos claramente cuántas quedan.
  var sobran = Math.max(0, pend.length - TOPE_HOY);
  pend.slice(0, TOPE_HOY).forEach(function(p){
    var det = (premioListo(p.c) ? '<span class="chip premio">🎁 Premio listo</span>' : '') +
      p.svs.map(function(sv){
        var a = atraso(sv);
        return '<span class="chip vencida">' + esc(sv.s) + ' · ' + a + 'd</span>';
      }).join("");
    var card = el(
      '<article class="card urge">' +
        '<div class="hd"><div class="who"><b>' + esc(p.c.n) + '</b><i>' +
          (p.svs.length === 1
            ? 'última ' + bonito(p.svs[0].u)
            : p.svs.length + ' servicios vencidos') + '</i></div>' +
        '<div class="money">' + soles(p.total) + '</div></div>' +
        '<div class="meta">' + det + '</div>' +
        '<button class="btn" type="button">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.3A10 10 0 1 0 12 2z"/></svg>' +
          'Escribirle por WhatsApp</button>' +
      '</article>'
    );
    card.querySelector("button").addEventListener("click", function(){ formMensaje(p.c, p.svs); });
    wrap.appendChild(card);
  });

  if(sobran){
    wrap.appendChild(el(
      '<div class="empty" style="padding:18px 16px;font-size:13.5px">' +
      'Quedan <b>' + sobran + '</b> clientas atrasadas más.<br>' +
      'Escríbeles mañana — la lista se reordena sola y siempre te pone arriba a las que más vale la pena.</div>'
    ));
  }

  if(hechas.length){
    wrap.appendChild(el('<div class="eyebrow" style="margin-top:10px">Escritas hoy · ' + hechas.length + '</div>'));
    hechas.forEach(function(p){
      wrap.appendChild(el(
        '<article class="card done"><div class="hd"><div class="who"><b>' + esc(p.c.n) + '</b><i>' +
        esc(p.svs.map(function(sv){ return sv.s; }).join(" · ")) + '</i></div>' +
        '<div class="money">' + soles(p.total) + '</div></div><div class="meta">' + chip("escrita") + '</div></article>'
      ));
    });
  }
  vHoy.appendChild(wrap);
}

/* ============ vista CLIENTAS ============ */
var vCli = document.getElementById("v-clientas");
var filtro = "todas", busca = "", abierta = null;

function pintarClientas(){
  vCli.innerHTML = "";
  var tools = el(
    '<div class="tools">' +
      '<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>' +
      '<input type="search" placeholder="Buscar clienta…" value="' + esc(busca) + '" aria-label="Buscar clienta"></div>' +
      '<div class="fchips">' +
        (S.puntos.activo ? ['todas','premio','vencida','porvencer','aldia','perdida']
                         : ['todas','vencida','porvencer','aldia','perdida']).map(function(f){
          var t = {todas:"Todas", premio:"🎁 Con premio", vencida:"Vencidas", porvencer:"Por vencer",
                   aldia:"Al día", perdida:"Perdidas"}[f];
          return '<button type="button" data-f="' + f + '" aria-pressed="' + (filtro===f) + '">' + t + '</button>';
        }).join("") +
      '</div>' +
    '</div>'
  );
  var inp = tools.querySelector("input");
  inp.addEventListener("input", function(){ busca = this.value; pintarClientas(); var n = vCli.querySelector("input"); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
  tools.querySelector(".fchips").addEventListener("click", function(e){
    var b = e.target.closest("button[data-f]"); if(!b) return;
    filtro = b.dataset.f; abierta = null; pintarClientas();
  });
  vCli.appendChild(tools);

  var lista = S.clientas.slice();
  if(busca.trim()){
    var q = busca.trim().toLowerCase();
    lista = lista.filter(function(c){
      return c.n.toLowerCase().indexOf(q) >= 0 ||
             String(c.tel||"").indexOf(q) >= 0 ||
             c.svcs.some(function(sv){ return sv.s.toLowerCase().indexOf(q) >= 0; });
    });
  }
  if(filtro === "premio") lista = lista.filter(premioListo);
  else if(filtro !== "todas") lista = lista.filter(function(c){ return estadoClienta(c) === filtro; });
  lista.sort(function(a,b){
    var pa = Math.max.apply(null, a.svcs.map(atraso).concat([-9999]));
    var pb = Math.max.apply(null, b.svcs.map(atraso).concat([-9999]));
    return pb - pa;
  });

  if(!lista.length){
    vCli.appendChild(el('<div class="empty">' + (S.clientas.length ? "Ninguna clienta con ese filtro." : "<b>Todavía no hay clientas</b>Toca «Nueva clienta» para empezar.") + '</div>'));
    return;
  }

  var wrap = el('<div class="stack"></div>');
  lista.forEach(function(c){
    var e = estadoClienta(c);
    var card = el('<article class="card"></article>');
    var hd = el(
      '<div class="hd" style="cursor:pointer">' +
        '<div class="who"><b>' + esc(c.n) + '</b><i>' + c.svcs.length + (c.svcs.length===1?' servicio':' servicios') +
        (c.tel ? ' · ' + esc(telBonito(c.tel)) : '') + '</i></div>' +
        (premioListo(c) ? '<span class="chip premio">🎁 Premio</span>' : chip(e)) +
      '</div>'
    );
    hd.addEventListener("click", function(){ abierta = (abierta === c.id) ? null : c.id; pintarClientas(); });
    card.appendChild(hd);

    if(abierta !== c.id){
      var resumen = c.svcs.map(function(sv){
        var a = atraso(sv);
        var txt = !sv.c ? "sin ciclo" : (a > 0 ? a + "d atrasado" : "en " + (-a) + "d");
        return '<span class="chip plain">' + esc(sv.s) + ' · ' + txt + '</span>';
      }).join("");
      card.appendChild(el('<div class="meta">' + resumen + '</div>'));
    } else {
      var svcs = el('<div class="svcs"></div>');
      c.svcs.forEach(function(sv, i){
        var a = atraso(sv), es = estado(sv);
        var row = el(
          '<div class="svc">' +
            '<div class="l1"><span class="nm">' + esc(sv.s) + '</span><span class="money">' + soles(sv.t) + '</span></div>' +
            '<div class="l2">' + chip(es) +
              (sv.c ? '<span class="mono">cada ' + sv.c + ' días</span>' : '<span>sin ciclo fijo</span>') +
              '<span>· última ' + bonito(sv.u) + '</span>' +
              (sv.c ? '<span>· ' + (a > 0 ? 'debió volver hace ' + a + 'd' : 'le toca ' + bonito(masDias(sv.u, sv.c))) + '</span>' : '') +
              (sv.w ? '<span>· escrita ' + bonito(sv.w) + '</span>' : '') +
            '</div>' +
            '<div class="acts">' +
              '<button class="btn sm" type="button" data-a="visita">Vino hoy</button>' +
              '<button class="btn sm line" type="button" data-a="msg">Escribirle</button>' +
              '<button class="btn sm line" type="button" data-a="edit">Editar</button>' +
              '<button class="btn sm line" type="button" data-a="del">Quitar</button>' +
            '</div>' +
          '</div>'
        );
        row.querySelector('[data-a="visita"]').addEventListener("click", function(){ registrarVisita(c, i); });
        row.querySelector('[data-a="msg"]').addEventListener("click", function(){ formMensaje(c, sv); });
        row.querySelector('[data-a="edit"]').addEventListener("click", function(){ formServicio(c, i); });
        row.querySelector('[data-a="del"]').addEventListener("click", function(){
          if(c.svcs.length === 1){ aviso("Es su único servicio. Mejor borra la clienta."); return; }
          c.svcs.splice(i, 1); guardar(); pintar();
        });
        svcs.appendChild(row);
      });
      card.appendChild(svcs);

      if(S.puntos.activo){
        var listo = premioListo(c);
        var pct = Math.min(100, Math.round((c.pts || 0) / S.puntos.meta * 100));
        var barra = el(
          '<div class="pts' + (listo ? ' listo' : '') + '">' +
            '<div class="l"><span>Puntos acumulados</span><b>' + (c.pts || 0) + ' / ' + S.puntos.meta + '</b></div>' +
            '<div class="progreso"><span style="width:' + pct + '%"></span></div>' +
            '<div class="l"><span>' + (listo ? '🎁 Le toca: ' + esc(S.puntos.premio)
                                             : 'Le faltan ' + faltan(c) + ' puntos') + '</span>' +
              (c.canjes && c.canjes.length ? '<span>' + c.canjes.length +
                (c.canjes.length === 1 ? ' premio canjeado' : ' premios canjeados') + '</span>' : '') +
            '</div>' +
            (listo ? '<button class="btn sm" type="button" data-a="canjear" style="width:100%">Entregar premio</button>' : '') +
          '</div>'
        );
        var bc = barra.querySelector('[data-a="canjear"]');
        if(bc) bc.addEventListener("click", function(){ confirmarCanje(c); });
        card.appendChild(barra);
      }

      if(c.nota) card.appendChild(el('<p style="font-size:13px;color:var(--muted)">' + esc(c.nota) + '</p>'));
      var acts = el(
        '<div class="pair">' +
          '<button class="btn ghost sm" type="button" data-a="svc" style="flex:1">+ Servicio</button>' +
          '<button class="btn line sm" type="button" data-a="ed" style="flex:1">Editar clienta</button>' +
          '<button class="btn danger sm" type="button" data-a="bo" style="flex:1">Borrar</button>' +
        '</div>'
      );
      if(S.puntos.activo){
        var extra = el('<button class="btn line sm" type="button" style="width:100%">Ajustar puntos a mano</button>');
        extra.addEventListener("click", function(){ formPuntosClienta(c); });
        card.appendChild(extra);
      }
      acts.querySelector('[data-a="svc"]').addEventListener("click", function(){ formServicio(c, -1); });
      acts.querySelector('[data-a="ed"]').addEventListener("click", function(){ formClienta(c); });
      acts.querySelector('[data-a="bo"]').addEventListener("click", function(){ confirmarBorrar(c); });
      card.appendChild(acts);
    }
    wrap.appendChild(card);
  });
  vCli.appendChild(wrap);
}

/* ============ vista RESUMEN ============ */
var vRes = document.getElementById("v-resumen");
function pintarResumen(){
  vRes.innerHTML = "";
  if(!S.clientas.length){
    vRes.appendChild(el('<div class="empty"><b>Sin datos todavía</b>Cuando agregues clientas aquí verás cuánta plata está en riesgo y cuánta recuperaste.</div>'));
    return;
  }
  var venc = [], perd = [], fuga = {};
  S.clientas.forEach(function(c){
    c.svcs.forEach(function(sv){
      var e = estado(sv);
      if(e === "vencida"){ venc.push(sv); fuga[META[sv.s] ? META[sv.s].g : "Otros"] = (fuga[META[sv.s] ? META[sv.s].g : "Otros"] || 0) + sv.t; }
      if(e === "perdida"){ perd.push(sv); fuga[META[sv.s] ? META[sv.s].g : "Otros"] = (fuga[META[sv.s] ? META[sv.s].g : "Otros"] || 0) + sv.t; }
    });
  });
  var riesgo = venc.reduce(function(a,s){ return a + s.t; }, 0);
  var nClientasVencidas = S.clientas.filter(function(c){
    return c.svcs.some(function(sv){ return estado(sv) === "vencida"; });
  }).length;
  var perdido = perd.reduce(function(a,s){ return a + s.t; }, 0);

  var mes = HOY.slice(0,7);
  var resMes = S.rescates.filter(function(r){ return r.f.slice(0,7) === mes; });
  var recup = resMes.reduce(function(a,r){ return a + r.m; }, 0);

  var wrap = el('<div class="stack"></div>');
  wrap.appendChild(el(
    '<div class="stat hi"><div class="k">En riesgo ahora mismo</div><div class="v">' + soles(riesgo) + '</div>' +
    '<div class="n">' + venc.length + (venc.length===1?' servicio vencido en ':' servicios vencidos en ') +
    nClientasVencidas + (nClientasVencidas===1?' clienta':' clientas') + '</div></div>'
  ));
  wrap.appendChild(el(
    '<div class="duo">' +
      '<div class="stat"><div class="k">Recuperado este mes</div><div class="v">' + soles(recup) + '</div>' +
      '<div class="n">' + resMes.length + (resMes.length===1?' clienta volvió':' clientas volvieron') + ' tras el mensaje</div></div>' +
      '<div class="stat"><div class="k">Ya perdidas</div><div class="v">' + soles(perdido) + '</div>' +
      '<div class="n">' + perd.length + ' con más de 45 días</div></div>' +
    '</div>'
  ));

  var pares = Object.keys(fuga).map(function(k){ return [k, fuga[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  if(pares.length){
    var max = pares[0][1];
    wrap.appendChild(el(
      '<div class="stat"><div class="k">Por dónde se fuga</div><div class="bars">' +
      pares.map(function(p){
        return '<div class="bar"><span>' + esc(p[0]) + '</span>' +
               '<span class="t"><span class="f" style="width:' + Math.round(p[1]/max*100) + '%"></span></span>' +
               '<span class="a">' + soles(p[1]) + '</span></div>';
      }).join("") + '</div></div>'
    ));
  }
  var canjeMes = (S.canjes || []).filter(function(x){ return x.f.slice(0,7) === mes; });
  if(S.puntos.activo){
    var listas = S.clientas.filter(premioListo).length;
    wrap.appendChild(el(
      '<div class="duo">' +
        '<div class="stat"><div class="k">Premios entregados</div><div class="v">' + canjeMes.length + '</div>' +
        '<div class="n">este mes</div></div>' +
        '<div class="stat"><div class="k">Premios listos</div><div class="v">' + listas + '</div>' +
        '<div class="n">' + (listas ? 'esperando que vengan' : 'ninguno por ahora') + '</div></div>' +
      '</div>'
    ));
  }
  var campMes = (S.campHist || []).filter(function(x){ return x.f.slice(0,7) === mes; });
  if(campMes.length){
    wrap.appendChild(el(
      '<div class="stat"><div class="k">Promos enviadas este mes</div><div class="v">' +
      campMes.reduce(function(a,x){ return a + x.enviados; }, 0) + '</div>' +
      '<div class="n">' + campMes.length + (campMes.length===1?' campaña':' campañas') + '</div></div>'
    ));
  }
  wrap.appendChild(el(
    '<div class="stat"><div class="k">Base de clientas</div><div class="v">' + S.clientas.length + '</div>' +
    '<div class="n">registradas · ' + S.clientas.reduce(function(a,c){ return a + c.svcs.length; }, 0) + ' servicios en seguimiento</div></div>'
  ));
  vRes.appendChild(wrap);
}

/* ============ acciones ============ */
function registrarVisita(c, i){
  var sv = c.svcs[i];
  // ¿fue un rescate? le escribimos en los últimos 30 días y estaba vencida
  if(sv.w && dias(sv.w, HOY) <= 30 && atraso(sv) > 0){
    S.rescates.push({f:HOY, m:sv.t, n:c.n, s:sv.s});
  }
  sv.u = HOY; sv.w = null;

  var listoAntes = premioListo(c);
  if(S.puntos.activo){
    c.pts = (c.pts || 0) + sv.t;
    c.ptsTotal = (c.ptsTotal || 0) + sv.t;
  }
  guardar(); pintar();

  if(S.puntos.activo && !listoAntes && premioListo(c)){
    aviso("🎁 " + c.n.split(" ")[0] + " llegó a su premio");
  } else if(S.puntos.activo){
    aviso("Visita registrada · +" + sv.t + " pts");
  } else {
    aviso("Visita registrada · " + c.n.split(" ")[0]);
  }
}

function formMensaje(c, svs){
  if(!Array.isArray(svs)) svs = [svs];
  var txt = mensaje(c, svs);
  abrir(
    '<h3>Mensaje para ' + esc(String(c.n).split(" ")[0]) + '</h3>' +
    '<div class="field"><label>Puedes editarlo antes de enviar</label>' +
    '<textarea id="m-txt">' + esc(txt) + '</textarea></div>' +
    (c.tel ? '' : '<p class="field hint" style="color:var(--accent)">Esta clienta no tiene WhatsApp guardado. Copia el mensaje y búscala en tu agenda.</p>') +
    '<a class="btn" id="m-wa" target="_blank" rel="noopener" href="' + esc(waHref(c, txt)) + '">' +
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.3A10 10 0 1 0 12 2z"/></svg>' +
      'Abrir WhatsApp</a>' +
    '<button class="btn ghost" type="button" id="m-copy">Copiar mensaje</button>' +
    '<button class="btn line" type="button" id="m-mark">Ya le escribí</button>' +
    '<button class="btn line" type="button" id="m-close">Cancelar</button>'
  );
  var ta = document.getElementById("m-txt");
  ta.addEventListener("input", function(){ document.getElementById("m-wa").href = waHref(c, ta.value); });
  document.getElementById("m-wa").addEventListener("click", function(){ marcar(); });
  document.getElementById("m-copy").addEventListener("click", function(){
    var v = ta.value;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(function(){ aviso("Mensaje copiado"); }, seleccionar);
    } else seleccionar();
    function seleccionar(){ ta.focus(); ta.select(); aviso("Selecciona y copia"); }
  });
  document.getElementById("m-mark").addEventListener("click", marcar);
  document.getElementById("m-close").addEventListener("click", cerrar);
  function marcar(){
    svs.forEach(function(sv){ sv.w = HOY; });
    guardar(); cerrar(); pintar(); aviso("Marcada como escrita");
  }
}

function opcionesServicio(sel){
  return CAT.map(function(gr){
    return '<optgroup label="' + esc(gr[0]) + '">' + gr[1].map(function(it){
      return '<option value="' + esc(it[0]) + '"' + (it[0] === sel ? " selected" : "") + '>' + esc(it[0]) + '</option>';
    }).join("") + '</optgroup>';
  }).join("");
}

function formClienta(c){
  var esNueva = !c || !c.id;
  abrir(
    '<h3>' + (esNueva ? "Nueva clienta" : "Editar clienta") + '</h3>' +
    '<div class="field"><label>Nombre</label><input id="f-n" type="text" value="' + esc(c ? c.n : "") + '" placeholder="Ej. Rosa Quispe" autocomplete="off"></div>' +
    '<div class="field"><label>WhatsApp</label><input id="f-t" type="tel" inputmode="numeric" value="' + esc(c ? telBonito(c.tel) : "") + '" placeholder="987 654 321">' +
      '<span class="hint">9 dígitos. Sirve para que el botón abra su chat directo.</span></div>' +
    (esNueva ?
      '<div class="field"><label>Servicio que se hizo</label><select id="f-s">' + opcionesServicio(null) + '</select></div>' +
      '<div class="two">' +
        '<div class="field"><label>Última visita</label><input id="f-u" type="date" value="' + HOY + '" max="' + HOY + '"></div>' +
        '<div class="field"><label>Precio (S/)</label><input id="f-p" type="number" min="0" step="5" value="110"></div>' +
      '</div>' : '') +
    '<div class="field"><label>Nota</label><input id="f-o" type="text" value="' + esc(c ? (c.nota||"") : "") + '" placeholder="Ej. alérgica al acrílico, prefiere sábados"></div>' +
    '<p class="err" id="f-err"></p>' +
    '<button class="btn" type="button" id="f-ok">' + (esNueva ? "Guardar clienta" : "Guardar cambios") + '</button>' +
    '<button class="btn line" type="button" id="f-no">Cancelar</button>'
  );
  if(esNueva){
    var sel = document.getElementById("f-s");
    sel.addEventListener("change", function(){
      var m = META[sel.value]; if(m) document.getElementById("f-p").value = m.t;
    });
    var m0 = META[sel.value]; if(m0) document.getElementById("f-p").value = m0.t;
  }
  document.getElementById("f-no").addEventListener("click", cerrar);
  document.getElementById("f-ok").addEventListener("click", function(){
    var n = document.getElementById("f-n").value.trim();
    var err = document.getElementById("f-err");
    if(!n){ err.textContent = "Ponle un nombre a la clienta."; err.classList.add("on"); return; }
    var tel = document.getElementById("f-t").value.replace(/\D/g, "");
    var nota = document.getElementById("f-o").value.trim();
    if(esNueva){
      var s = document.getElementById("f-s").value;
      var u = document.getElementById("f-u").value || HOY;
      if(u > HOY){ err.textContent = "La última visita no puede ser en el futuro."; err.classList.add("on"); return; }
      var p = parseFloat(document.getElementById("f-p").value);
      S.clientas.push({id:nuevoId(), n:n, tel:tel, nota:nota, pts:0, ptsTotal:0, canjes:[],
        svcs:[{s:s, c:META[s] ? META[s].c : 30, u:u, t:isNaN(p) ? (META[s]?META[s].t:0) : p, w:null}]});
      aviso(n.split(" ")[0] + " agregada");
    } else {
      c.n = n; c.tel = tel; c.nota = nota;
      aviso("Cambios guardados");
    }
    guardar(); cerrar(); pintar();
  });
}

function formServicio(c, i){
  var esNuevo = i < 0;
  var sv = esNuevo ? null : c.svcs[i];
  abrir(
    '<h3>' + (esNuevo ? "Agregar servicio" : "Editar servicio") + '</h3>' +
    '<p class="field hint">' + esc(c.n) + '</p>' +
    '<div class="field"><label>Servicio</label><select id="s-s">' + opcionesServicio(sv ? sv.s : null) + '</select></div>' +
    '<div class="two">' +
      '<div class="field"><label>Última visita</label><input id="s-u" type="date" value="' + (sv ? sv.u : HOY) + '" max="' + HOY + '"></div>' +
      '<div class="field"><label>Precio (S/)</label><input id="s-p" type="number" min="0" step="5" value="' + (sv ? sv.t : 110) + '"></div>' +
    '</div>' +
    '<div class="field"><label>Cada cuántos días vuelve</label><input id="s-c" type="number" min="0" max="730" value="' + (sv ? sv.c : 21) + '">' +
      '<span class="hint">Ajústalo a esta clienta si viene más seguido o más espaciado. 0 = sin ciclo fijo.</span></div>' +
    '<p class="err" id="s-err"></p>' +
    '<button class="btn" type="button" id="s-ok">Guardar</button>' +
    '<button class="btn line" type="button" id="s-no">Cancelar</button>'
  );
  var sel = document.getElementById("s-s");
  sel.addEventListener("change", function(){
    var m = META[sel.value];
    if(m){ document.getElementById("s-p").value = m.t; document.getElementById("s-c").value = m.c; }
  });
  if(esNuevo){ var m0 = META[sel.value]; if(m0){ document.getElementById("s-p").value = m0.t; document.getElementById("s-c").value = m0.c; } }
  document.getElementById("s-no").addEventListener("click", cerrar);
  document.getElementById("s-ok").addEventListener("click", function(){
    var s = sel.value, u = document.getElementById("s-u").value || HOY;
    var err = document.getElementById("s-err");
    if(u > HOY){ err.textContent = "La última visita no puede ser en el futuro."; err.classList.add("on"); return; }
    var p = parseFloat(document.getElementById("s-p").value); if(isNaN(p) || p < 0) p = 0;
    var ci = parseInt(document.getElementById("s-c").value, 10); if(isNaN(ci) || ci < 0) ci = 0;
    if(esNuevo){
      if(c.svcs.some(function(x){ return x.s === s; })){ err.textContent = "Esta clienta ya tiene ese servicio."; err.classList.add("on"); return; }
      c.svcs.push({s:s, c:ci, u:u, t:p, w:null});
    } else { sv.s = s; sv.c = ci; sv.u = u; sv.t = p; }
    guardar(); cerrar(); pintar(); aviso("Servicio guardado");
  });
}

function confirmarBorrar(c){
  abrir(

function cargarEjemplos(){
  // Los ejemplos se arman con los servicios que tenga configurado ESTE negocio,
  // no con una lista fija. Así la demostración funciona en cualquier rubro.
  var todos = [];
  CAT.forEach(function(gr){ gr[1].forEach(function(it){ if(it[1]) todos.push(it[0]); }); });
  if(!todos.length){ aviso("Configura primero los servicios"); return; }

  var NOMS = SALON.genero === "m"
    ? ["Luis Ramos","Carlos Chávez","Diego Salazar","Andrés Ríos","Manuel Huamán","Jorge Núñez","Piero Loayza","Renzo Quispe"]
    : ["Rosa Quispe","Milagros Chávez","Katherine Ramos","Andrea Salazar","Fiorella Ríos","Jazmín Huamán","Gabriela Núñez","Carmen Loayza"];
  // días desde la última visita, como múltiplo del ciclo: unos al día, otros vencidos, uno perdido
  var FACTOR = [1.6, 1.4, 1.3, 1.25, 1.2, 1.15, 0.3, 6];
  var PTS    = [540, 270, 390, 610, 180, 320,  90, 425];

  NOMS.forEach(function(nombre, i){
    var cuantos = 1 + (i % 2);            // 1 o 2 servicios
    var svcs = [];
    for(var j = 0; j < cuantos; j++){
      var nom = todos[(i + j * 3) % todos.length];
      if(svcs.some(function(x){ return x.s === nom; })) continue;
      var m = META[nom];
      var d = Math.round(m.c * FACTOR[i % FACTOR.length]) + j * 3;
      svcs.push({s:nom, c:m.c, u:masDias(HOY, -d), t:m.t, w:null});
    }
    S.clientas.push({id:nuevoId(), n:nombre, tel:"98" + (7111222 + i * 111111),
      nota:"", pts:PTS[i % PTS.length], ptsTotal:PTS[i % PTS.length], canjes:[], svcs:svcs});
  });
  S.puntos.activo = true;   // para que el ejemplo muestre el programa funcionando
  guardar(); pintar(); aviso(NOMS.length + " clientas de ejemplo cargadas");
}

/* ============ campañas de promoción ============ */
/* WhatsApp bloquea números que disparan muchos mensajes seguidos. Por eso acá no
   hay "envío masivo automático": hay una COLA que abre un chat a la vez y frena
   a los 25 por día. Es más lento y es lo único que no le cuesta el número. */
var TOPE_DIA = 25;
var TOPE_HOY = 30;   // cuántas clientas mostrar en "Hoy" como máximo (ver pintarHoy)
var DESCANSO_PROMO = 14;   // días mínimos entre una promo y la siguiente a la misma clienta

var PLANTILLAS = SALON.plantillas;

// los grupos salen del catálogo del negocio, no de una lista fija
var GRUPOS = ["Todos"].concat(CAT.map(function(gr){ return gr[0]; }));
var SITUS_BASE = [
  ["todas",    "Todas"],
  ["d30",      "No viene hace 30+ días"],
  ["d60",      "No viene hace 60+ días"],
  ["perdidas", "Solo las perdidas"],
  ["activas",  "Solo las que sí vienen"],
  ["premio",   "🎁 Con premio listo"]
];
function SITUS_VIS(){ return S.puntos.activo ? SITUS_BASE : SITUS_BASE.filter(function(x){ return x[0] !== "premio"; }); }
var SITUS = SITUS_BASE;
var seg = {g:"Todos", s:"todas"};
var borrador = "";

function diasSinVenir(c, g){
  var svs = (g === "Todos") ? c.svcs : c.svcs.filter(function(sv){ return META[sv.s] && META[sv.s].g === g; });
  if(!svs.length) return null;
  return Math.min.apply(null, svs.map(function(sv){ return dias(sv.u, HOY); }));
}

function enSegmento(c){
  var d = diasSinVenir(c, seg.g);
  if(d === null) return false;                       // no se hace nada de ese grupo
  if(seg.s === "d30" && d < 30) return false;
  if(seg.s === "d60" && d < 60) return false;
  if(seg.s === "perdidas" && estadoClienta(c) !== "perdida") return false;
  if(seg.s === "activas"){
    var e = estadoClienta(c);
    if(e !== "aldia" && e !== "porvencer") return false;
  }
  if(seg.s === "premio" && !premioListo(c)) return false;
  return true;
}
function frescaDePromo(c){ return c.pm && dias(c.pm, HOY) < DESCANSO_PROMO; }

function calcularSegmento(){
  var dentro = S.clientas.filter(enSegmento);
  return {
    lista:    dentro.filter(function(c){ return !frescaDePromo(c); }),
    descanso: dentro.filter(frescaDePromo).length,
    sinTel:   dentro.filter(function(c){ return !c.tel; }).length
  };
}
function conNombre(txt, c){
  return String(txt).replace(/\{nombre\}/g, String(c.n).trim().split(/\s+/)[0]);
}

  }).join("") + '</div>'));

    var b = e.target.closest("button[data-g], button[data-s]"); if(!b) return;
    if(b.dataset.g) seg.g = b.dataset.g; else seg.s = b.dataset.s;

    '<div class="prev" id="p-prev"></div></div>');
  vPro.appendChild(prev);

  var ir = el('<button class="btn" type="button" id="p-ir">Preparar envío · ' + r.lista.length +
    (r.lista.length === 1 ? " clienta" : " clientas") + '</button>');

    if(!borrador.trim()){ aviso("Escribe el mensaje primero"); ta.focus(); return; }
    if(!r.lista.length){ aviso("No hay clientas en ese grupo"); return; }
    arrancarCampana(r.lista);
  });
  vPro.appendChild(ir);

  actualizarPrevia();
  function actualizarPrevia(){
    var p = document.getElementById("p-prev");
    if(p) p.textContent = borrador.trim() ? conNombre(borrador, muestra) : "Elige una plantilla o escribe tu mensaje.";
  }

  // historial
  if(S.campHist && S.campHist.length){
    vPro.appendChild(el('<div class="eyebrow" style="margin:26px 0 10px">Campañas anteriores</div>'));
    var h = el('<div class="stack"></div>');
    S.campHist.slice().reverse().slice(0, 6).forEach(function(x){
      h.appendChild(el('<div class="card"><div class="hd"><div class="who">' +
        '<b>' + esc(x.txt.slice(0, 44)) + '…</b><i>' + bonito(x.f) + ' · ' + esc(x.seg) + '</i></div>' +
        '<div class="money">' + x.enviados + '</div></div></div>'));
    });

  }
}

function nombreSeg(){
  var t = SITUS.filter(function(x){ return x[0] === seg.s; })[0];
  return seg.g + " · " + (t ? t[1] : "");
}

function arrancarCampana(lista){
  S.camp = {
    f: HOY, txt: borrador, seg: nombreSeg(),
    cola: lista.map(function(c){ return c.id; }),
    enviados: [], saltados: [], hoy: 0, dia: HOY
  };
  guardar(); abrirCola();
}

function cerrarCampana(){
  if(S.camp && S.camp.enviados.length){
    S.campHist = S.campHist || [];
    S.campHist.push({f:HOY, txt:S.camp.txt, seg:S.camp.seg, enviados:S.camp.enviados.length});
  }
  S.camp = null; guardar(); cerrar(); pintar();
}

function abrirCola(){
  if(!S.camp) return;
  if(S.camp.dia !== HOY){ S.camp.dia = HOY; S.camp.hoy = 0; guardar(); }

  var hechos = S.camp.enviados.concat(S.camp.saltados);
  var quedan = S.camp.cola.filter(function(id){ return hechos.indexOf(id) < 0; });

  if(!quedan.length){
    abrir('<h3>Campaña terminada</h3>' +
      '<p class="field hint">Le escribiste a ' + S.camp.enviados.length +
      (S.camp.enviados.length === 1 ? ' clienta.' : ' clientas.') + '</p>' +
      '<button class="btn" type="button" id="q-fin">Listo</button>');
    document.getElementById("q-fin").addEventListener("click", cerrarCampana);
    return;
  }

  if(S.camp.hoy >= TOPE_DIA){
    abrir('<h3>Ya van ' + TOPE_DIA + ' hoy</h3>' +
      '<p class="field hint">Mejor sigue mañana. Mandar decenas de mensajes el mismo día es lo que hace ' +
      'que WhatsApp bloquee tu número, y recuperarlo es un dolor de cabeza. ' +
      'Quedan <b>' + quedan.length + '</b> en la cola, te esperan.</p>' +
      '<button class="btn" type="button" id="q-ok">Seguir mañana</button>' +
      '<button class="btn line" type="button" id="q-igual">Continuar igual</button>');
    document.getElementById("q-ok").addEventListener("click", function(){ cerrar(); pintar(); });
    document.getElementById("q-igual").addEventListener("click", function(){ S.camp.hoy = 0; guardar(); abrirCola(); });
    return;
  }

  var c = S.clientas.filter(function(x){ return x.id === quedan[0]; })[0];
  if(!c){ S.camp.saltados.push(quedan[0]); guardar(); abrirCola(); return; }

  var txt = conNombre(S.camp.txt, c);
  var n = hechos.length + 1, tot = S.camp.cola.length;
  abrir(
    '<div class="eyebrow">' + n + ' de ' + tot + ' · ' + S.camp.hoy + (S.camp.hoy === 1 ? ' enviado hoy' : ' enviados hoy') + '</div>' +
    '<div class="progreso" style="margin:2px 0 6px"><span style="width:' + Math.round((n-1)/tot*100) + '%"></span></div>' +
    '<h3>' + esc(c.n) + '</h3>' +
    (c.tel ? '<p class="field hint">' + esc(telBonito(c.tel)) + '</p>'
           : '<p class="field hint" style="color:var(--accent)">Sin WhatsApp guardado — copia el mensaje y búscala en tu agenda.</p>') +
    '<div class="prev">' + esc(txt) + '</div>' +
    '<a class="btn" id="q-wa" target="_blank" rel="noopener" href="' + esc(waHref(c, txt)) + '">' +
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.3A10 10 0 1 0 12 2z"/></svg>' +
      'Abrir su chat y enviar</a>' +
    '<button class="btn ghost" type="button" id="q-copy">Copiar mensaje</button>' +
    '<div class="pair"><button class="btn line" type="button" id="q-skip">Saltar</button>' +
    '<button class="btn line" type="button" id="q-pause">Pausar</button></div>'
  );

  document.getElementById("q-wa").addEventListener("click", function(){
    c.pm = HOY;
    S.camp.enviados.push(c.id); S.camp.hoy++;
    guardar();
    setTimeout(abrirCola, 350);   // deja que WhatsApp abra antes de pasar a la siguiente
  });
  document.getElementById("q-copy").addEventListener("click", function(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ aviso("Copiado"); }, function(){ aviso("No se pudo copiar"); });
    } else aviso("No se pudo copiar");
  });
  document.getElementById("q-skip").addEventListener("click", function(){
    S.camp.saltados.push(c.id); guardar(); abrirCola();
  });
  document.getElementById("q-pause").addEventListener("click", function(){ cerrar(); pintar(); });
}


/* ============ instalar en el equipo ============ */
var promptInstal = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); promptInstal = e; });
function esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
function yaInstalada(){
  try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
  catch(e){ return false; }
}

/* ============ navegación ============ */
var tab = "hoy";
var titulo = document.getElementById("t-title"), nota = document.getElementById("t-note");
var fab = document.getElementById("fab");

function pintar(){
  if(tab === "hoy") pintarHoy();
  else if(tab === "clientas") pintarClientas();
  else if(tab === "promos") pintarPromos();
  else pintarResumen();

  var pend = pendientes();
  var monto = pend.reduce(function(a,p){ return a + p.total; }, 0);
  var bg = document.getElementById("bg");
  bg.textContent = pend.length;
  bg.style.display = pend.length ? "flex" : "none";

  if(tab === "hoy"){
    titulo.textContent = "Hoy";
    nota.textContent = GEN(!S.clientas.length ? "Empecemos por tus clientas."
      : pend.length ? (pend.length > TOPE_HOY
            ? "Las " + TOPE_HOY + " más urgentes de " + pend.length + " · " + soles(monto) + " en juego"
            : pend.length + (pend.length===1 ? " clienta por escribir · " : " clientas por escribir · ") + soles(monto) + " en juego")
      : "Ninguna clienta atrasada. Todo al día.");
  } else if(tab === "clientas"){
    titulo.textContent = GEN("Clientas");
    nota.textContent = GEN(S.clientas.length + (S.clientas.length===1 ? " clienta registrada" : " clientas registradas"));
  } else if(tab === "promos"){
    titulo.textContent = "Promos";
    var enCurso = S.camp ? (S.camp.cola.length - S.camp.enviados.length - S.camp.saltados.length) : 0;
    nota.textContent = GEN(enCurso ? "Campaña en curso · " + enCurso + " por enviar"
                               : "Escríbele a un grupo de clientas a la vez.");
  } else {
    titulo.textContent = "Resumen";
    nota.textContent = bonito(HOY);
  }
  fab.classList.toggle("on", (tab === "hoy" || tab === "clientas") && S.clientas.length > 0);
}

document.querySelector(".tabbar").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]"); if(!b) return;
  tab = b.dataset.tab; abierta = null;
  Array.prototype.forEach.call(this.querySelectorAll("button[data-tab]"), function(x){
    x.setAttribute("aria-selected", String(x === b));
  });
  ["hoy","clientas","promos","resumen"].forEach(function(t){
    document.getElementById("v-" + t).classList.toggle("on", t === tab);
  });
  window.scrollTo(0, 0);
  pintar();
});
fab.addEventListener("click", function(){ formClienta(null); });

/* La portada se va apenas cargan las tipografías, con un mínimo para que no parpadee
   y un máximo para que nunca deje esperando a la dueña. */
(function(){
  var sp = document.getElementById("splash");
  if(!sp) return;
  var t0 = Date.now ? Date.now() : +new Date();
  var fuera = false;
  function quitar(){
    if(fuera) return; fuera = true;
    sp.classList.add("ir");
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 600);
  }
  function cuandoToque(){
    var pasado = (Date.now ? Date.now() : +new Date()) - t0;
    setTimeout(quitar, Math.max(0, 550 - pasado));
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(cuandoToque, cuandoToque);
  else cuandoToque();
  setTimeout(quitar, 1600);          // tope duro
  sp.addEventListener("click", quitar);   // impaciente: un toque y se va
})();

cargar();
pintar();
if(!PUEDE_GUARDAR) avisoStorage();
})();
